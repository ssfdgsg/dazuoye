<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影排行榜 - 电影推荐系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #111827;
            --muted: #94a3b8;
            --text: #e5e7eb;
            --primary: #22d3ee;
            --primary-strong: #0ea5e9;
            --border: #1f2937;
            --accent: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text);
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.1) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 100%);
            pointer-events: none;
        }

        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            transition: width 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text);
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* 用户下拉菜单样式 */
        .user-menu { position: relative; display: none; }
        .user-menu.active { display: block; }
        .user-name {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #0b1220;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-name:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3); }
        .user-name i { font-size: 0.9rem; }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            min-width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .user-menu:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item {
            padding: 0.8rem 1.2rem;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: rgba(34, 211, 238, 0.1); padding-left: 1.5rem; }
        .dropdown-item i { width: 20px; color: var(--primary); }
        .dropdown-item.user-info {
            cursor: default;
            background: rgba(34, 211, 238, 0.05);
            font-size: 0.9rem;
            color: var(--muted);
        }
        .dropdown-item.user-info:hover { background: rgba(34, 211, 238, 0.05); padding-left: 1.2rem; }
        .dropdown-item.user-info strong { color: var(--text); }

        .search-bar {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.5rem 2.5rem 0.5rem 1rem;
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar i {
            position: absolute;
            right: 1rem;
            color: var(--muted);
        }

        .login-btn {
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            color: #0d1117;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.4);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .rank-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .rank-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rank-header p {
            color: var(--muted);
            font-size: 1.1rem;
        }

        .rank-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            color: #0d1117;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.3);
        }

        .rank-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .rank-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .rank-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .rank-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .rank-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            color: #0d1117;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 2;
        }

        .rank-number.top3 {
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .movie-poster {
            width: 100%;
            height: 330px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 1rem;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
            height: 2.5rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            color: #ffd700;
            font-weight: 600;
        }

        .movie-rating i {
            font-size: 0.9rem;
        }

        .movie-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .filter-options {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-select, .filter-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-input {
            width: 100px;
            cursor: text;
        }

        .filter-input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }

        /* 移除数字输入框的上下箭头 */
        .filter-input::-webkit-outer-spin-button,
        .filter-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .filter-input[type=number] {
            -moz-appearance: textfield;
        }

        .year-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .year-range span {
            color: var(--muted);
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        @media (max-width: 768px) {
            nav {
                padding: 0 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                gap: 1.5rem;
            }

            main {
                padding: 1rem;
            }

            .rank-header h1 {
                font-size: 2rem;
            }

            .rank-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 1rem;
            }

            .movie-poster {
                height: 270px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.5rem;
            }

            .nav-actions {
                width: 100%;
                justify-content: center;
            }

            .search-bar {
                flex: 1;
                min-width: 0;
            }

            .rank-tabs {
                gap: 0.5rem;
            }

            .tab-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }

            .rank-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .movie-poster {
                height: 240px;
            }
        }
    </style>
</head>

    <main>
        <section class="rank-header">
            <h1>电影排行榜</h1>
            <p>探索最受欢迎、评分最高的电影</p>
        </section>

        <section class="rank-tabs">
            <button class="tab-btn active" data-tab="rating">评分榜</button>
            <button class="tab-btn" data-tab="popularity">热度榜</button>
            <button class="tab-btn" data-tab="new">新片榜</button>
            <button class="tab-btn" data-tab="boxoffice">票房榜</button>
        </section>

        <section class="filter-options">
            <select class="filter-select" id="genre-filter">
                <option value="all">全部类型</option>
                <option value="action">动作</option>
                <option value="comedy">喜剧</option>
                <option value="drama">剧情</option>
                <option value="sci-fi">科幻</option>
                <option value="romance">爱情</option>
                <option value="thriller">惊悚</option>
            </select>
            <div class="year-range">
                <input type="number" class="filter-input" id="year-from" placeholder="起始年份" min="1900" max="2100">
                <span>至</span>
                <input type="number" class="filter-input" id="year-to" placeholder="结束年份" min="1900" max="2100">
            </div>
        </section>

        <section id="rating" class="rank-container active">
            <div class="rank-grid" id="rating-grid">
                <!-- 评分榜内容将通过JavaScript动态生成 -->
            </div>
        </section>

        <section id="popularity" class="rank-container">
            <div class="rank-grid" id="popularity-grid">
                <!-- 热度榜内容将通过JavaScript动态生成 -->
            </div>
        </section>

        <section id="new" class="rank-container">
            <div class="rank-grid" id="new-grid">
                <!-- 新片榜内容将通过JavaScript动态生成 -->
            </div>
        </section>

        <section id="boxoffice" class="rank-container">
            <div class="rank-grid" id="boxoffice-grid">
                <!-- 票房榜内容将通过JavaScript动态生成 -->
            </div>
        </section>
    </main>

    <script>
        // HTML 转义函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 跳转到电影详情页
        function goToMovieDetail(movieId) {
            window.location.href = `/static/movie.html?id=${movieId}`;
        }

        // 从 API 加载排行榜数据
        async function loadRankings(type, genreFilter = 'all', yearFrom = '', yearTo = '') {
            try {
                let url = `/api/rankings?type=${type}&genre=${genreFilter}&limit=50`;
                
                // 添加年份范围参数
                if (yearFrom) {
                    url += `&year_from=${yearFrom}`;
                }
                if (yearTo) {
                    url += `&year_to=${yearTo}`;
                }
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Failed to fetch rankings');
                }
                const movies = await response.json();
                return movies;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initUserMenu();

            // 生成所有排行榜内容
            generateRatingRank();
            generatePopularityRank();
            generateNewRank();
            generateBoxofficeRank();

            // 标签切换功能
            const tabBtns = document.querySelectorAll('.tab-btn');
            const rankContainers = document.querySelectorAll('.rank-container');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    
                    // 更新标签状态
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 显示对应排行榜
                    rankContainers.forEach(container => {
                        container.classList.remove('active');
                    });
                    document.getElementById(tabId).classList.add('active');
                });
            });

            // 过滤功能 - 重新加载当前激活的排行榜
            const genreFilter = document.getElementById('genre-filter');
            const yearFromInput = document.getElementById('year-from');
            const yearToInput = document.getElementById('year-to');

            async function applyFilters() {
                const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-tab');
                
                // 根据当前激活的标签重新加载相应排行榜
                switch(activeTab) {
                    case 'rating':
                        await generateRatingRank();
                        break;
                    case 'popularity':
                        await generatePopularityRank();
                        break;
                    case 'new':
                        await generateNewRank();
                        break;
                    case 'boxoffice':
                        await generateBoxofficeRank();
                        break;
                }
            }

            genreFilter.addEventListener('change', applyFilters);
            yearFromInput.addEventListener('change', applyFilters);
            yearToInput.addEventListener('change', applyFilters);
        });

        // 登录状态检查，控制登录按钮/用户菜单/管理员链接
        async function checkLoginStatus() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                const loginBtn = document.getElementById('loginBtn');
                const userMenu = document.getElementById('userMenu');
                const adminLink = document.getElementById('adminLink');

                if (data.logged_in) {
                    if (loginBtn) loginBtn.style.display = 'none';
                    if (userMenu) userMenu.classList.add('active');

                    const userNameText = document.getElementById('userNameText');
                    const dropdownUsername = document.getElementById('dropdownUsername');
                    const dropdownUserId = document.getElementById('dropdownUserId');
                    if (userNameText) userNameText.textContent = data.username || '用户';
                    if (dropdownUsername) dropdownUsername.textContent = data.username || '未知';
                    if (dropdownUserId) dropdownUserId.textContent = data.user_id || '-';

                    const ratingHistoryLink = document.getElementById('ratingHistoryLink');
                    if (ratingHistoryLink) {
                        ratingHistoryLink.href = `/static/user_ratings.html?user_id=${data.user_id}`;
                    }

                    const logoutLink = document.getElementById('logoutLink');
                    if (logoutLink) {
                        logoutLink.addEventListener('click', async (e) => {
                            e.preventDefault();
                            try {
                                await fetch('/api/logout', { method: 'POST' });
                                window.location.reload();
                            } catch (err) {
                                console.error('退出登录失败:', err);
                            }
                        });
                    }

                    if (adminLink) adminLink.style.display = data.is_admin ? 'block' : 'none';
                } else {
                    if (loginBtn) loginBtn.style.display = 'block';
                    if (userMenu) userMenu.classList.remove('active');
                    if (adminLink) adminLink.style.display = 'none';
                }
            } catch (err) {
                console.error('检查登录状态失败:', err);
            }
        }

        // 生成评分榜
        async function generateRatingRank() {
            const grid = document.getElementById('rating-grid');
            const genreFilter = document.getElementById('genre-filter').value;
            const yearFrom = document.getElementById('year-from').value;
            const yearTo = document.getElementById('year-to').value;
            const movies = await loadRankings('rating', genreFilter, yearFrom, yearTo);
            renderMovies(movies, grid);
        }

        // 生成热度榜
        async function generatePopularityRank() {
            const grid = document.getElementById('popularity-grid');
            const genreFilter = document.getElementById('genre-filter').value;
            const yearFrom = document.getElementById('year-from').value;
            const yearTo = document.getElementById('year-to').value;
            const movies = await loadRankings('popularity', genreFilter, yearFrom, yearTo);

        }

        // 生成新片榜
        async function generateNewRank() {
            const grid = document.getElementById('new-grid');

            const yearTo = document.getElementById('year-to').value;

        // 生成票房榜
        async function generateBoxofficeRank() {
            const grid = document.getElementById('boxoffice-grid');
            const genreFilter = document.getElementById('genre-filter').value;
            const yearFrom = document.getElementById('year-from').value;
            const yearTo = document.getElementById('year-to').value;
            const movies = await loadRankings('boxoffice', genreFilter, yearFrom, yearTo);
            renderMovies(movies, grid);
        }

        // 渲染电影卡片
        function renderMovies(movieList, container) {
            if (!movieList || movieList.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--muted);padding:2rem;">暂无数据</p>';
                return;
            }

            container.innerHTML = '';
            
            movieList.forEach((movie) => {
                const card = document.createElement('div');
                card.className = 'rank-card';
                card.style.cursor = 'pointer';
                
                // 提取第一个类型
                const firstGenre = movie.genres && movie.genres.length > 0 ? movie.genres[0] : 'Unknown';
                const releaseYear = movie.release_date ? new Date(movie.release_date).getFullYear() : 'N/A';
                
                card.dataset.genre = firstGenre.toLowerCase();
                card.dataset.year = releaseYear;
                
                // 为前三名添加特殊样式
                const rankClass = movie.rank <= 3 ? 'rank-number top3' : 'rank-number';
                
                card.innerHTML = `
                    <div class="${rankClass}">${movie.rank}</div>
                    <img src="/${movie.poster}" alt="${escapeHtml(movie.title)}" class="movie-poster" onerror="this.src='/img/default.webp'">
                    <div class="card-content">
                        <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
                        <div class="movie-rating">
                            <i class="fas fa-star"></i>
                            <span>${movie.rating.toFixed(1)}</span>
                        </div>
                        <div class="movie-info">
                            <span>${releaseYear}</span>
                            <span>${escapeHtml(firstGenre)}</span>
                        </div>
                    </div>
                `;
                
                // 添加点击事件
                card.addEventListener('click', () => goToMovieDetail(movie.id));
                
                container.appendChild(card);
            });
        }
