<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>个人即时预测</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #0d1117;
      --panel: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --primary: #22d3ee;
      --primary-strong: #0ea5e9;
      --border: #1f2937;
      --accent: #a855f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(34,211,238,0.12), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(168,85,247,0.15), transparent 28%),
                  var(--bg);
      color: var(--text);
      padding: 0 20px 48px;
    }

    /* 顶部导航，与首页保持一致的切换体验 */
    header.top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      margin: 0 -20px;
      padding: 12px 0;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--primary-strong));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.6rem;
      padding: 0;
      margin: 0;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      position: relative;
      padding: 4px 0;
      transition: all 0.3s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background: linear-gradient(90deg, var(--primary), var(--primary-strong));
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .search-bar {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-bar input {
      padding: 0.6rem 2rem 0.6rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
    }

    .search-bar i {
      position: absolute;
      right: 0.8rem;
      color: var(--muted);
    }

    .login-btn {
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #0b1220;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
    }

    /* 用户下拉菜单 */
    .user-menu { position: relative; display: none; }
    .user-menu.active { display: block; }
    .user-name {
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #0b1220;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .user-name:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3); }
    .user-name i { font-size: 0.9rem; }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .user-menu:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .dropdown-item {
      padding: 0.8rem 1.2rem;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: all 0.2s ease;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: rgba(34, 211, 238, 0.1); padding-left: 1.5rem; }
    .dropdown-item i { width: 20px; color: var(--primary); }
    .dropdown-item.user-info { cursor: default; background: rgba(34, 211, 238, 0.05); font-size: 0.9rem; color: var(--muted); }
    .dropdown-item.user-info:hover { background: rgba(34, 211, 238, 0.05); padding-left: 1.2rem; }
    .dropdown-item.user-info strong { color: var(--text); }

    h1 { margin: 0 0 8px; font-size: 26px; font-weight: 700; letter-spacing: 0.3px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    .container { max-width: 1080px; margin: 0 auto; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card {
      background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 18px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .card h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0.2px; }
    .card small { color: var(--muted); }

    .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 12px 0 6px; }
    label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
    input[type="number"] { width: 140px; }
    input[type="number"], input[type="text"] {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34,211,238,0.18);
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #0b1220;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      box-shadow: 0 12px 30px rgba(34,211,238,0.25);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(34,211,238,0.3); }
    button:active { transform: translateY(0); box-shadow: 0 10px 24px rgba(34,211,238,0.22); }

    .result { margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 600; letter-spacing: 0.2px; }
    tr:hover td { background: rgba(255,255,255,0.03); }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34,211,238,0.12);
      color: var(--primary);
      font-size: 12px;
      margin-left: 8px;
    }
    .muted { color: var(--muted); }
    .error { color: #f87171; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); padding: 10px 12px; border-radius: 10px; }
    .empty { color: var(--muted); font-size: 14px; margin: 6px 0; }

    /* 模型拟合进度样式 */
    .progress-header { display: flex; justify-content: space-between; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .progress-shell {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
      margin: 8px 0 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--primary), var(--primary-strong));
      box-shadow: 0 4px 18px rgba(34,211,238,0.35);
      transition: width 0.5s ease;
    }
    .progress-fill.indeterminate {
      position: relative;
      width: 40%;
      min-width: 120px;
      animation: indet 1.2s ease-in-out infinite;
    }
    @keyframes indet {
      0% { left: -20%; }
      50% { left: 60%; }
      100% { left: -20%; }
    }
    .progress-meta {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .progress-meta strong { color: var(--text); font-size: 15px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 14px 0 6px; }
    .stat { padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.02); }
    .stat-value { font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
    .stage-track { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
    .stage-item { padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); position: relative; overflow: hidden; }
    .stage-item h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .stage-item p { margin: 0; color: var(--muted); font-size: 13px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.done { background: rgba(34,211,238,0.14); color: var(--primary); }
    .badge.active { background: rgba(168,85,247,0.16); color: var(--accent); }
    .badge.pending { background: rgba(255,255,255,0.08); color: var(--muted); }
    .log-panel { margin-top: 18px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.02); overflow: hidden; }
    .log-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-weight: 600; }
    .log-body { max-height: 220px; overflow-y: auto; padding: 12px 14px; font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .log-line { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .log-line:last-child { border-bottom: none; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .ghost-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ghost-btn:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <header class="top-nav">
    <nav>
      <div class="logo">电影推荐系统</div>
      <ul class="nav-links">
        <li><a href="/" >首页</a></li>
        <li><a href="/static/recommend.html" class="active">训练进度</a></li>
        <li><a href="/static/movie_rank.html">排行榜</a></li>
      </ul>
      <div class="nav-actions">
        <div class="search-bar">
          <input type="text" placeholder="搜索电影..." disabled>
          <i class="fas fa-search"></i>
        </div>
        <!-- 登录按钮 -->
        <a href="/static/login.html" class="login-btn" id="loginBtn">登录</a>
        <!-- 用户菜单 -->
        <div class="user-menu" id="userMenu">
          <div class="user-name" id="userName">
            <i class="fas fa-user-circle"></i>
            <span id="userNameText">用户</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="dropdown-menu">
            <div class="dropdown-item user-info">
              <i class="fas fa-user"></i>
              <span>用户名: <strong id="dropdownUsername">-</strong></span>
            </div>
            <div class="dropdown-item user-info">
              <i class="fas fa-id-card"></i>
              <span>ID: <strong id="dropdownUserId">-</strong></span>
            </div>
            <a href="#" class="dropdown-item" id="ratingHistoryLink">
              <i class="fas fa-star"></i>
              <span>用户评分表</span>
            </a>
            <a href="#" class="dropdown-item" id="logoutLink">
              <i class="fas fa-sign-out-alt"></i>
              <span>退出登录</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <div class="container">
    <header style="margin-bottom:20px;">
      <h1>个人即时预测</h1>
      <p class="lead">评分后系统会自动为当前登录用户异步重算个性化推荐，这里展示该过程的进度与日志。</p>
    </header>

    <section class="card" id="progressCard">
      <div class="progress-header">
        <div style="flex:1 1 360px;">
          <p class="muted" id="statusLine" style="margin:0 0 6px;">状态：空闲</p>
          <p class="muted" id="stageLabel" style="margin:0 0 10px;">当前阶段：等待启动</p>
          <div class="progress-shell" aria-label="预测进度">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-meta" style="gap:0.8rem;">
            <span>完成度 <strong id="progressValue">0%</strong></span>
            <span>运行时长 <strong id="elapsed">--</strong></span>
            <span>备注 <strong id="eta">--</strong></span>
          </div>
          <div class="progress-meta" style="flex-direction:column; align-items:flex-start; gap:6px;">
            <span>进程 PID：<strong id="pidLine">--</strong></span>
            <span>开始时间：<strong id="startTime">--</strong></span>
          </div>
        </div>
        <div class="controls"></div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <span class="muted">当前 RMSE</span>
          <div class="stat-value" id="rmseValue">--</div>
        </div>
        <div class="stat">
          <span class="muted">训练样本</span>
          <div class="stat-value" id="sampleValue">--</div>
        </div>
        <div class="stat">
          <span class="muted">阶段/INFO</span>
          <div class="stat-value" id="stageInfo">--</div>
        </div>
      </div>

      <div class="result" style="margin-top:14px;">
        <h2 style="margin:0 0 8px;">预测结果 (TOP 10)</h2>
        <div id="resultList" class="grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));"></div>
      </div>

      <div class="log-panel">
        <div class="log-header">
          <span>实时日志</span>
          <button class="ghost-btn" onclick="manualRefresh()">刷新</button>
        </div>
        <div class="log-body" id="logBody"></div>
      </div>
    </section>
  </div>

  <script src="/static/user_menu.js"></script>
  <script>
    const stages = [
      { key: 'prepare', label: '准备输入', desc: '加载用户特征与召回候选', threshold: 20 },
      { key: 'score', label: '打分排序', desc: '计算个性化得分并排序', threshold: 60 },
      { key: 'assemble', label: '组装结果', desc: '整理 TOPN 结果并返回', threshold: 90 },
      { key: 'done', label: '完成', desc: '完成输出', threshold: 100 }
    ];

    const state = {
      userId: null,
      progress: 0,
      startAt: null,
      stageIndex: 0,
      logs: [],
      running: false,
      stage: null,
      message: null,
      poll: null,
      predResult: [],
      lastStatus: 'idle'
    };

    const el = (id) => document.getElementById(id);

    function stamp(msg) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
      return `[${timeStr}] ${msg}`;
    }

    function formatDuration(ms) {
      if (!ms || ms < 0) return '00:00';
      const sec = Math.floor(ms / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateStageIndex() {
      if (typeof state.progress === 'number') {
        const idx = stages.findIndex((s) => state.progress < s.threshold);
        state.stageIndex = idx === -1 ? stages.length - 1 : idx;
      } else {
        state.stageIndex = 0;
      }
    }

    function renderStages() {
      const current = stages[state.stageIndex];
      const stageLabel = state.running
        ? (state.stage || (current ? current.label : '进行中'))
        : (state.stage || '空闲');
      el('stageLabel').textContent = `当前阶段：${stageLabel}`;
      const statusLine = state.running
        ? '状态：正在为当前用户重算推荐'
        : (state.predResult.length ? '状态：已完成' : '状态：空闲');
      el('statusLine').textContent = statusLine;
      el('stageInfo').textContent = stageLabel;
    }

    function renderLogs() {
      const body = el('logBody');
      if (!state.logs.length) {
        body.innerHTML = '<div class="log-line">暂无日志，点击“开始拟合”以启动。</div>';
        return;
      }
      body.innerHTML = state.logs.map(line => `<div class="log-line">${line}</div>`).join('');
    }

    function renderResults() {
      const list = el('resultList');
      if (state.running) {
        list.innerHTML = '<div class="log-line">正在计算个性化推荐... 请稍候</div>';
        return;
      }
      if (!state.predResult.length) {
        list.innerHTML = '<div class="log-line">暂无个性化结果。评分后系统会自动重算，也可稍后刷新。</div>';
        return;
      }
      list.innerHTML = state.predResult.map((m) => {
        const genres = Array.isArray(m.genre || m.genres) ? (m.genre || m.genres).slice(0, 3).join(' / ') : (m.genre || m.genres || '').toString();
        const score = m.prediction || m.predict_rating || m.rating || 0;
        const poster = m.poster && m.poster.startsWith('http') ? m.poster : `/img/${m.id || m.movie_id}.webp`;
        return `
          <div class="card">
            <h2 style="margin:0 0 8px; font-size:16px;">${m.title || '未命名'} <span class="pill" style="margin-left:6px;">${score.toFixed ? score.toFixed(2) : score}</span></h2>
            <div class="muted" style="margin:0 0 6px;">类型：${genres || '--'}</div>
            <div class="muted" style="margin:0 0 6px;">影片ID：${m.id || m.movie_id || '--'}</div>
            <div class="muted" style="margin:0 0 6px;">上映：${m.release_date || m.release_year || '--'}</div>
            <img src="${poster}" alt="poster" style="width:100%; border-radius:10px; object-fit:cover; min-height:180px;" onerror="this.src='/img/default.webp'" />
          </div>
        `;
      }).join('');
    }

    function render() {
      updateStageIndex();

      const fill = el('progressFill');
      const pct = typeof state.progress === 'number' ? Math.max(0, Math.min(100, state.progress)) : 0;
      fill.style.width = `${pct}%`;
      el('progressValue').textContent = `${pct.toFixed(0)}%`;

      const elapsed = state.startAt ? Date.now() - state.startAt : 0;
      el('elapsed').textContent = state.startAt ? formatDuration(elapsed) : '--';
      el('eta').textContent = state.message || '--';
      el('pidLine').textContent = '--';
      el('startTime').textContent = state.startAt ? new Date(state.startAt).toLocaleTimeString('zh-CN', { hour12: false }) : '--';
      el('rmseValue').textContent = '--';
      el('sampleValue').textContent = '--';

      renderStages();
      renderLogs();
      renderResults();
    }

    function pushLog(msg) {
      state.logs.unshift(stamp(msg));
      state.logs = state.logs.slice(0, 50);
      renderLogs();
    }

    function resetView() {
      if (state.poll) { clearInterval(state.poll); state.poll = null; }
      state.progress = 0;
      state.startAt = null;
      state.running = false;
      state.stage = '等待启动';
      state.predResult = [];
      state.logs = [];
      render();
    }

    async function pollTaskAndLogs() {
      if (!state.userId) return;
      try {
        const [sRes, lRes] = await Promise.all([
          fetch(`/api/als/task/${state.userId}`),
          fetch(`/api/als/logs/${state.userId}`)
        ]);
        const sJson = await sRes.json();
        const lJson = await lRes.json();
        if (sRes.ok) {
          state.running = sJson.status === 'running';
          state.progress = typeof sJson.progress === 'number' ? sJson.progress : (state.running ? 10 : (sJson.status === 'done' ? 100 : 0));
          state.startAt = sJson.started_at ? sJson.started_at * 1000 : state.startAt;
          state.stage = sJson.status || null;
          state.message = sJson.message || null;
          state.lastStatus = sJson.status || 'idle';
        }
        if (lRes.ok && Array.isArray(lJson.logs)) {
          state.logs = lJson.logs.slice().reverse();
        }
        render();
        if (state.lastStatus === 'done') {
          await fetchRecommendations();
        }
      } catch (e) {
        // 忽略间歇错误
      }
    }

    async function fetchRecommendations() {
      if (!state.userId) return;
      try {
        const res = await fetch(`/api/user/${state.userId}/recommend?topN=10`);
        const data = await res.json();
        if (res.ok && Array.isArray(data.recommendations || data.movies)) {
          const list = data.recommendations || data.movies;
          state.predResult = list.map(r => ({
            id: r.movie_id || r.id,
            title: r.title,
            genre: r.genres || r.genre,
            poster: r.poster || `/img/${r.movie_id || r.id}.webp`,
            prediction: r.prediction || r.predicted_rating || r.rating || 0,
            release_date: r.release_date || r.release_year
          }));
          render();
        }
      } catch (e) {}
    }

    function manualRefresh() { pollTaskAndLogs(); }

    document.addEventListener('DOMContentLoaded', () => {
      initUserMenu();
      resetView();
      // 获取当前会话以确定 userId
      fetch('/api/session').then(r => r.json()).then(s => {
        if (s && s.user_id) {
          state.userId = s.user_id;
          // 初次拉取数据
          pollTaskAndLogs();
          fetchRecommendations();
          // 定时轮询进度与日志
          state.poll = setInterval(pollTaskAndLogs, 2000);
        } else {
          pushLog('未登录：请先登录以查看个性化进度');
          render();
        }
      }).catch(() => {
        pushLog('无法获取会话信息');
        render();
      });
    });
  </script>
</body>
</html>
