<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的评分记录 - 电影推荐系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #111827;
            --muted: #94a3b8;
            --text: #e5e7eb;
            --primary: #22d3ee;
            --primary-strong: #548ba5;
            --border: #1f2937;
            --accent: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text);
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.1) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 100%);
            pointer-events: none;
        }

        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .nav-links a:hover { color: var(--primary); }

        .nav-actions { display: flex; gap: 1rem; align-items: center; }

        .search-bar { position: relative; display: flex; align-items: center; }
        .search-bar input {
            padding: 0.6rem 2rem 0.6rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
        }
        .search-bar i { position: absolute; right: 0.8rem; color: var(--muted); }

        .back-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #0b1220;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: var(--muted);
            font-size: 1.1rem;
        }

        .user-info-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
        }

        .user-details h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .user-stats {
            display: flex;
            gap: 2rem;
            color: var(--muted);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-item i {
            color: var(--primary);
        }

        .filters {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group label {
            color: var(--muted);
            font-weight: 500;
        }

        .filter-group select {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
        }

        .ratings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .rating-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .rating-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(34, 211, 238, 0.2);
            border-color: var(--primary);
        }

        .movie-poster {
            width: 100%;
            height: 400px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--panel), var(--border));
        }

        .rating-info {
            padding: 1rem;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .rating-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .user-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .user-rating i {
            color: #fbbf24;
        }

        .movie-meta {
            font-size: 0.85rem;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .rating-time {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .rating-time i {
            color: var(--primary);
            font-size: 0.8rem;
        }

        .no-ratings {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
        }

        .no-ratings i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .no-ratings h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .ratings-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .movie-poster {
                height: 300px;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .user-info-card {
                flex-direction: column;
                text-align: center;
            }

            .user-stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">影视阁</div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/static/recommend.html">训练进度</a></li>
                <li><a href="/static/movie_rank.html">排行榜</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-bar">
                    <input type="text" placeholder="搜索电影..." disabled>
                    <i class="fas fa-search"></i>
                </div>
                <a href="javascript:history.back()" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1>我的评分记录</h1>
            <p id="pageSubtitle">查看您的所有电影评分历史</p>
        </div>

        <!-- 用户信息卡片 -->
        <div class="user-info-card" id="userInfoCard" style="display: none;">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-details">
                <h2 id="userDisplayName">用户</h2>
                <div class="user-stats">
                    <div class="stat-item">
                        <i class="fas fa-star"></i>
                        <span>总评分: <strong id="totalRatings">0</strong></span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-chart-line"></i>
                        <span>平均评分: <strong id="avgRating">0.0</strong></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选器 -->
        <div class="filters" id="filtersSection" style="display: none;">
            <div class="filter-group">
                <label for="sortBy">排序:</label>
                <select id="sortBy">
                    <option value="time_desc">最近评分</option>
                    <option value="time_asc">最早评分</option>
                    <option value="rating_desc">评分从高到低</option>
                    <option value="rating_asc">评分从低到高</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterRating">筛选评分:</label>
                <select id="filterRating">
                    <option value="all">全部</option>
                    <option value="5">5星</option>
                    <option value="4">4星及以上</option>
                    <option value="3">3星及以上</option>
                    <option value="2">2星及以上</option>
                    <option value="1">1星及以上</option>
                </select>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="loading" id="loadingState">
            <i class="fas fa-spinner"></i>
            <p>加载中...</p>
        </div>

        <!-- 评分列表 -->
        <div class="ratings-grid" id="ratingsGrid"></div>

        <!-- 无评分提示 -->
        <div class="no-ratings" id="noRatings" style="display: none;">
            <i class="fas fa-inbox"></i>
            <h3>暂无评分记录</h3>
            <p>您还没有为任何电影评分</p>
        </div>
    </main>

    <script>
        let allRatings = [];
        let currentUserId = null;
        let currentUsername = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取用户ID
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = urlParams.get('user_id');

            if (!currentUserId) {
                // 如果没有user_id参数，尝试从session获取
                checkSession();
            } else {
                loadUserRatings(currentUserId);
            }

            // 绑定筛选和排序事件
            document.getElementById('sortBy').addEventListener('change', applyFilters);
            document.getElementById('filterRating').addEventListener('change', applyFilters);
        });

        // 检查session获取当前用户
        async function checkSession() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (data.logged_in) {
                    currentUserId = data.user_id;
                    currentUsername = data.username;
                    loadUserRatings(currentUserId);
                } else {
                    // 未登录，跳转到登录页
                    window.location.href = '/static/login.html';
                }
            } catch (err) {
                console.error('检查会话失败:', err);
                alert('获取用户信息失败，请重新登录');
                window.location.href = '/static/login.html';
            }
        }

        // 加载用户评分数据
        async function loadUserRatings(userId) {
            try {
                const res = await fetch(`/api/user/${userId}/ratings`);
                const data = await res.json();

                if (res.ok && data.success) {
                    allRatings = data.ratings || [];
                    displayUserInfo(data);
                    renderRatings(allRatings);
                } else {
                    console.error('加载评分失败:', data.message);
                    showNoRatings();
                }
            } catch (err) {
                console.error('加载评分数据失败:', err);
                showNoRatings();
            }
        }

        // 显示用户信息
        function displayUserInfo(data) {
            document.getElementById('loadingState').style.display = 'none';
            
            if (allRatings.length > 0) {
                document.getElementById('userInfoCard').style.display = 'flex';
                document.getElementById('filtersSection').style.display = 'flex';
                document.getElementById('userDisplayName').textContent = data.username || '用户';
                document.getElementById('totalRatings').textContent = data.total_ratings || 0;
                document.getElementById('avgRating').textContent = (data.avg_rating || 0).toFixed(1);
            } else {
                showNoRatings();
            }
        }

        // 渲染评分列表
        function renderRatings(ratings) {
            const grid = document.getElementById('ratingsGrid');
            grid.innerHTML = '';

            if (ratings.length === 0) {
                showNoRatings();
                return;
            }

            ratings.forEach(rating => {
                const card = createRatingCard(rating);
                grid.appendChild(card);
            });
        }

        // 创建评分卡片
        function createRatingCard(rating) {
            const card = document.createElement('div');
            card.className = 'rating-card';
            card.onclick = () => goToMovieDetail(rating.movie_id);

            const posterUrl = rating.poster || `/img/${rating.movie_id}.webp`;
            const releaseYear = rating.release_date ? new Date(rating.release_date).getFullYear() : '未知';
            const ratingTime = rating.rating_time ? new Date(rating.rating_time).toLocaleDateString('zh-CN') : '未知日期';

            card.innerHTML = `
                <img src="${posterUrl}" 
                     alt="${escapeHtml(rating.title)}" 
                     class="movie-poster"
                     onerror="this.src='/img/default.webp'">
                <div class="rating-info">
                    <div class="movie-title">${escapeHtml(rating.title)}</div>
                    <div class="rating-details">
                        <div class="user-rating">
                            <i class="fas fa-star"></i>
                            <span>${rating.rating.toFixed(1)}</span>
                        </div>
                    </div>
                    <div class="movie-meta">
                        <div>年份: ${releaseYear}</div>
                        <div class="rating-time">
                            <i class="fas fa-clock"></i>
                            <span>评分于: ${ratingTime}</span>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        // 应用筛选和排序
        function applyFilters() {
            let filtered = [...allRatings];

            // 按评分筛选
            const filterRating = document.getElementById('filterRating').value;
            if (filterRating !== 'all') {
                const minRating = parseFloat(filterRating);
                filtered = filtered.filter(r => r.rating >= minRating);
            }

            // 排序
            const sortBy = document.getElementById('sortBy').value;
            filtered.sort((a, b) => {
                switch(sortBy) {
                    case 'time_desc':
                        return new Date(b.rating_time) - new Date(a.rating_time);
                    case 'time_asc':
                        return new Date(a.rating_time) - new Date(b.rating_time);
                    case 'rating_desc':
                        return b.rating - a.rating;
                    case 'rating_asc':
                        return a.rating - b.rating;
                    default:
                        return 0;
                }
            });

            renderRatings(filtered);
        }

        // 显示无评分状态
        function showNoRatings() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('userInfoCard').style.display = 'none';
            document.getElementById('filtersSection').style.display = 'none';
            document.getElementById('ratingsGrid').innerHTML = '';
            document.getElementById('noRatings').style.display = 'block';
        }

        // 跳转到电影详情页
        function goToMovieDetail(movieId) {
            window.location.href = `/static/movie.html?id=${movieId}`;
        }

        // XSS防护
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
