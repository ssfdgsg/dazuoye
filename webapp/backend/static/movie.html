<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影网站</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #111827;
            --muted: #94a3b8;
            --text: #e5e7eb;
            --primary: #22d3ee;
            --primary-strong: #0ea5e9;
            --border: #1f2937;
            --accent: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text);
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.1) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 100%);
            pointer-events: none;
        }

        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            padding: 4px 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-bar {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            padding: 0.6rem 2rem 0.6rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
        }

        .search-bar i {
            position: absolute;
            right: 0.8rem;
            color: var(--muted);
        }

        .login-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #0b1220;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3);
        }

        .user-menu { position: relative; display: none; }
        .user-menu.active { display: block; }
        .user-name {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #0b1220;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-name:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(34, 211, 238, 0.3); }
        .user-name i { font-size: 0.9rem; }
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            min-width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .user-menu:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item {
            padding: 0.8rem 1.2rem;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: rgba(34, 211, 238, 0.1); padding-left: 1.5rem; }
        .dropdown-item i { width: 20px; color: var(--primary); }
        .dropdown-item.user-info { cursor: default; background: rgba(34, 211, 238, 0.05); font-size: 0.9rem; color: var(--muted); }
        .dropdown-item.user-info:hover { background: rgba(34, 211, 238, 0.05); padding-left: 1.2rem; }
        .dropdown-item.user-info strong { color: var(--text); }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .movie-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: row;
            position: relative;
        }

        .movie-poster {
            width: 300px;
            min-width: 300px;
            height: auto;
            object-fit: cover;
            border-radius: 16px 0 0 16px;
        }

        .movie-info {
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .movie-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            color: #ffd700;
            font-weight: 600;
        }

        .movie-rating i {
            margin-right: 0.5rem;
        }

        .movie-description {
            color: var(--muted);
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .movie-details {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .movie-detail {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .rating-module {
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .rating-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .star-rating {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .stars-display {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .stars-display .star {
            color: rgba(255,255,255,0.15);
            font-size: 1.8rem;
            transition: color 0.15s ease;
        }

        .stars-display .star.half {
            /* 半星视觉：使用半星图标替代整颗星 */
            color: #ffd700;
        }

        .stars-display .star.full {
            color: #ffd700;
        }

        /* 不再使用隐藏的点击分段元素，交互由 starsDisplay 处理 */

        .score-text {
            margin-left: 12px;
            color: var(--muted);
            font-size: 0.95rem;
            align-self: center;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #ffd700;
        }

        .rating-comment {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            resize: vertical;
            min-height: 80px;
            margin-bottom: 1rem;
        }

        .rating-comment:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
        }

        .submit-rating {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #0b1220;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.25);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .submit-rating:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(34, 211, 238, 0.3);
        }

        .submit-rating:active {
            transform: translateY(0);
            box-shadow: 0 10px 24px rgba(34, 211, 238, 0.22);
        }

        /* 相似电影样式 */
        .similar-movies-section {
            margin-top: 3rem;
        }

        .similar-movies-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-strong));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .similar-movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .similar-movie-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .similar-movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(34, 211, 238, 0.2);
            border-color: var(--primary);
        }

        .similar-movie-poster {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .similar-movie-info {
            padding: 1rem;
        }

        .similar-movie-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .similar-movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .similar-movie-rating {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #ffd700;
            font-size: 0.9rem;
        }

        .similar-movie-similarity {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .similarity-badge {
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.3);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }

        footer {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            position: relative;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .social-links {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .social-links a {
            color: var(--muted);
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .copyright {
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* 响应式设计 */
        @media (max-width: 968px) {
            .movie-card {
                flex-direction: column;
            }

            .movie-poster {
                width: 100%;
                min-width: 100%;
                height: 400px;
                border-radius: 16px 16px 0 0;
            }

            .similar-movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 0 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            .nav-links {
                gap: 1rem;
            }

            main {
                padding: 1rem;
            }

            .movie-info {
                padding: 1.5rem;
            }

            .similar-movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 0.8rem;
            }

            .nav-links a {
                font-size: 0.9rem;
            }

            .movie-info {
                padding: 1.2rem;
            }

            .movie-title {
                font-size: 1.4rem;
            }

            .movie-details {
                gap: 0.8rem;
            }

            .star-rating label {
                font-size: 1.6rem;
            }

            .similar-movies-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .similar-movies-title {
                font-size: 1.4rem;
            }
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

        <nav>

                <li><a href="/static/recommend.html">训练进度</a></li>

            <div class="nav-actions">

    <main>

                        <div class="movie-detail">

                        <div class="movie-detail">
                            <i class="fas fa-calendar"></i>
                            <span>2023年</span>
                        </div>
                        <div class="movie-detail">
                            <i class="fas fa-film"></i>
                            <span>动作/冒险</span>

    <script src="/static/user_menu.js"></script>
    <script>
        // 从 URL 获取电影 ID
        function getMovieIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // HTML 转义函数防止 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 加载电影详情
        async function loadMovieDetails() {
            const movieId = getMovieIdFromUrl();
            
            if (!movieId) {
                alert('缺少电影 ID 参数');
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(`/api/movie/${movieId}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        alert('未找到该电影');
                        window.location.href = '/';
                        return;
                    }
                    throw new Error('Failed to fetch movie details');
                }

                const movie = await response.json();
                renderMovieDetails(movie);
                
            } catch (error) {
                console.error('Error loading movie details:', error);
                alert('加载电影详情失败，请稍后重试');
            }
        }

        // 渲染电影详情到页面
        function renderMovieDetails(movie) {
            // 更新电影海报
            const posterImg = document.querySelector('.movie-poster');
            if (posterImg) {
                posterImg.src = `/${movie.poster}`;
                posterImg.alt = escapeHtml(movie.title);
                posterImg.onerror = function() {
                    this.src = '/img/default.webp';
                };
            }

            // 更新电影标题
            const titleElement = document.querySelector('.movie-title');
            if (titleElement) {
                titleElement.textContent = movie.title;
            }

            // 更新评分
            const ratingSpan = document.querySelector('.movie-rating span');
            if (ratingSpan) {
                ratingSpan.textContent = movie.rating.toFixed(1);
            }

            // 更新简介
            const descElement = document.querySelector('.movie-description');
            if (descElement) {
                descElement.textContent = movie.overview || '暂无简介';
            }

            // 更新详细信息
            const detailItems = document.querySelectorAll('.movie-detail');
            if (detailItems.length >= 3) {
                detailItems[0].innerHTML = `<i class="fas fa-clock"></i><span>${movie.runtime || '未知'} 分钟</span>`;

                const releaseYear = movie.release_date ? new Date(movie.release_date).getFullYear() : '未知';
                detailItems[1].innerHTML = `<i class="fas fa-calendar"></i><span>${releaseYear} 年</span>`;

                const genres = movie.genres.join(' / ') || '未分类';
                detailItems[2].innerHTML = `<i class="fas fa-film"></i><span>${escapeHtml(genres)}</span>`;
            }

            // 更新额外信息（如果有的话）
            if (movie.keywords && movie.keywords.length > 0) {
                const keywordsContainer = document.querySelector('.movie-keywords');
                if (keywordsContainer) {
                    keywordsContainer.innerHTML = movie.keywords
                        .slice(0, 5)
                        .map(kw => `<span class="keyword">${escapeHtml(kw)}</span>`)
                        .join('');
                }
            }

            // 更新评价人数
            if (movie.vote_count) {
                const voteCountElement = document.querySelector('.vote-count');
                if (voteCountElement) {
                    voteCountElement.textContent = `${movie.vote_count} 人评价`;
                }
            }

            // 更新页面标题
            document.title = `${movie.title} - 电影推荐系统`;
        }

        // 加载相似电影
        async function loadSimilarMovies(movieId) {
            const container = document.getElementById('similar-movies-grid');
            
            try {
                const response = await fetch(`/api/similar-movies/${movieId}?limit=12`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch similar movies');
                }

                const movies = await response.json();
                renderSimilarMovies(movies, container);
                
            } catch (error) {
                console.error('Error loading similar movies:', error);
                container.innerHTML = '<p style="text-align:center;color:var(--muted);">加载失败</p>';
            }
        }

        // 渲染相似电影
        function renderSimilarMovies(movies, container) {
            if (!movies || movies.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--muted);">暂无相似电影</p>';
                return;
            }

            container.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'similar-movie-card';
                card.onclick = () => {
                    window.location.href = `/static/movie.html?id=${movie.id}`;
                };
                
                const similarityPercent = (movie.similarity * 100).toFixed(0);
                
                card.innerHTML = `
                    <img src="/${movie.poster}" alt="${escapeHtml(movie.title)}" class="similar-movie-poster" onerror="this.src='/img/default.webp'">
                    <div class="similar-movie-info">
                        <div class="similar-movie-title" title="${escapeHtml(movie.title)}">${escapeHtml(movie.title)}</div>
                        <div class="similar-movie-meta">
                            <div class="similar-movie-rating">
                                <i class="fas fa-star"></i>
                                <span>${movie.rating ? movie.rating.toFixed(1) : 'N/A'}</span>
                            </div>
                            <div class="similar-movie-similarity">
                                <span class="similarity-badge">${similarityPercent}%</span>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            initUserMenu();
            const movieId = getMovieIdFromUrl();
            if (movieId) {
                loadMovieDetails();
                loadSimilarMovies(movieId);
            }
            // 新评分交互逻辑（1-10 分，显示半颗星）
            let selectedRating = 0;
            const starsDisplay = document.getElementById('starsDisplay');
            const scoreText = document.getElementById('scoreText');

            function renderStarsForRating(r) {
                // r 是 0-10 的整数
                const fullStars = Math.floor(r / 2);
                const half = r % 2 === 1;
                const starElems = starsDisplay.querySelectorAll('.star');
                starElems.forEach((el, idx) => {
                    el.classList.remove('full', 'half', 'empty');
                    if (idx < fullStars) {
                        el.classList.add('full');
                    } else if (idx === fullStars && half) {
                        // 将当前星替换为半星图标
                        el.classList.add('half');
                    } else {
                        el.classList.add('empty');
                    }
                });
                scoreText.textContent = `当前评分: ${r} 分`;
            }

            // 初始化为 0
            renderStarsForRating(0);

            // 绑定 hover（mousemove）和 click 事件到 starsDisplay 区域
            // 通过鼠标在星星区域的位置，动态计算 1-10 的评分（更直观、无需额外分段元素）
            if (starsDisplay) {
                starsDisplay.style.cursor = 'pointer';

                function calcValueFromEvent(e) {
                    const rect = starsDisplay.getBoundingClientRect();
                    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                    // 限制 x 到 [0, width]
                    const w = rect.width;
                    const pct = Math.max(0, Math.min(1, x / w));
                    // 10 个分段，左到右 1..10
                    const val = Math.ceil(pct * 10);
                    return Math.max(1, Math.min(10, val));
                }

                starsDisplay.addEventListener('mousemove', (e) => {
                    const hoverVal = calcValueFromEvent(e);
                    renderStarsForRating(hoverVal);
                });

                starsDisplay.addEventListener('mouseleave', () => {
                    renderStarsForRating(selectedRating);
                });

                // 点击设置评分
                starsDisplay.addEventListener('click', (e) => {
                    selectedRating = calcValueFromEvent(e);
                    renderStarsForRating(selectedRating);
                });

                // 触屏支持： touchmove 显示， touchend 确定
                starsDisplay.addEventListener('touchmove', (e) => {
                    const hoverVal = calcValueFromEvent(e);
                    renderStarsForRating(hoverVal);
                    e.preventDefault();
                }, { passive: false });

                starsDisplay.addEventListener('touchend', (e) => {
                    selectedRating = calcValueFromEvent(e);
                    renderStarsForRating(selectedRating);
                });
            }

            const submitBtn = document.querySelector('.submit-rating');
            if (submitBtn) {
                submitBtn.addEventListener('click', async function() {
                    const commentInput = document.querySelector('textarea[name="comment"]');
                    if (!selectedRating || selectedRating < 1 || selectedRating > 10) {
                        alert('请选择评分（1 到 10 分）');
                        return;
                    }

                    // 弹出确认评分数
                    const confirmed = confirm(`您将提交 ${selectedRating} 分，确定要提交吗？`);
                    if (!confirmed) return;

                    const movieId = getMovieIdFromUrl();
                    const rating = parseFloat(selectedRating);
                    const comment = commentInput ? commentInput.value : '';

                    submitBtn.disabled = true;
                    const prevText = submitBtn.textContent;
                    submitBtn.textContent = '提交中...';

                    try {
                        const sessionResp = await fetch('/api/session');
                        const sessionData = await sessionResp.json();

                        if (!sessionData.logged_in) {
                            alert('请先登录后再评分');
                            window.location.href = '/static/login.html';
                            return;
                        }

                        const response = await fetch(`/api/movie/${movieId}/rate`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ rating, comment })
                        });

                        if (response.ok) {
                            alert(`评分提交成功：${rating} 分`);
                            try {
                                // 提示首页“猜你喜欢”需要刷新
                                localStorage.setItem('recommendNeedsRefresh', '1');
                            } catch (e) {
                                // ignore storage errors
                            }
                            // 重置
                            selectedRating = 0;
                            renderStarsForRating(0);
                            if (commentInput) commentInput.value = '';
                        } else {
                            const error = await response.json();
                            const detail = error.detail ? ` (${error.detail})` : '';
                            alert('评分提交失败：' + (error.error || '未知错误') + detail);
                        }
                    } catch (error) {
                        console.error('Error submitting rating:', error);
                        alert('评分提交失败，请稍后重试');
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = prevText;
                    }
                });
            }
        });
    </script>
</body>
</html>
